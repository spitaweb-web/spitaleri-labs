name: Verify AV Passport

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/verify-av-passport.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Vercel automation credential availability
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "HAS_VERCEL_TOKEN"
          else
            echo "NO_VERCEL_TOKEN"
          fi
