name: Verify AV Passport

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/verify-av-passport.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify candidate public Vercel project
        shell: bash
        run: |
          set -euo pipefail
          URL="https://alfombra-verde-clientes-public2-agustin-spitaleris-projects.vercel.app"
          BODY="$(curl -fsSL --max-time 20 "$URL")"
          printf '%s' "$BODY" | grep -q "AV PUBLIC2 TEST"
          echo "VERIFIED $URL"
